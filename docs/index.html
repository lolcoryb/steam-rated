<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rated — new on Steam, sorted by review score</title>
<meta name="description" content="Browse recent Steam releases sorted by review rating: Overwhelmingly Positive, Very Positive, and down. Updated daily.">
<meta name="color-scheme" content="dark">
<meta property="og:title" content="Rated — new on Steam by review score">
<meta property="og:description" content="Recent Steam releases sorted by review rating. Updated daily.">
<meta property="og:type" content="website">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><text y='26' font-size='26'>&#127918;</text></svg>">
<style>
  :root {
    --bg:#0d1117; --panel:#151b24; --panel2:#1b232e; --line:#28313d;
    --text:#e6ebf2; --dim:#8b98a8; --faint:#5d6a7a; --accent:#66c0f4;
    --t9:#35d07f; --t8:#66c0f4; --t7:#9ec6de; --t6:#c7c86a;
    --t5:#d2b33c; --t4:#e0894a; --t3:#e2705f; --t2:#d4483f; --t1:#b02e22;
    --radius:10px;
  }
  *,*::before,*::after{box-sizing:border-box}
  html{-webkit-text-size-adjust:100%}
  body{
    margin:0;background:var(--bg);color:var(--text);
    font:15px/1.55 "Inter","Segoe UI",system-ui,-apple-system,sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  a{color:var(--accent)}
  .wrap{max-width:1400px;margin:0 auto;padding:0 20px}

  /* ---------- header ---------- */
  header{border-bottom:1px solid var(--line);background:var(--panel)}
  .head{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap;padding:20px 0 18px}
  h1{margin:0;font-size:21px;font-weight:650;letter-spacing:-.2px}
  h1 .mark{color:var(--accent)}
  .tagline{color:var(--dim);font-size:13.5px}
  .stamp{margin-left:auto;color:var(--faint);font-size:12.5px;white-space:nowrap}

  /* ---------- presets ---------- */
  .presets{display:flex;gap:8px;flex-wrap:wrap;padding-bottom:16px}
  .preset{
    background:var(--panel2);border:1px solid var(--line);color:var(--dim);
    padding:7px 13px;border-radius:999px;font:inherit;font-size:13px;
    cursor:pointer;transition:.12s;white-space:nowrap;
  }
  .preset:hover{color:var(--text);border-color:var(--faint)}
  .preset.on{background:rgba(102,192,244,.16);border-color:var(--accent);color:#cfe9fa}

  /* ---------- filter bar ---------- */
  .bar{
    position:sticky;top:0;z-index:20;background:rgba(21,27,36,.96);
    backdrop-filter:blur(8px);border-bottom:1px solid var(--line);
  }
  .barin{display:flex;flex-direction:column;gap:11px;padding:13px 0}
  .chips{display:flex;gap:6px;flex-wrap:wrap}
  .chip{
    background:transparent;border:1px solid var(--line);color:var(--dim);
    padding:5px 11px;border-radius:999px;font:inherit;font-size:12.5px;
    cursor:pointer;transition:.12s;white-space:nowrap;display:inline-flex;
    align-items:center;gap:6px;
  }
  .chip:hover{color:var(--text);border-color:var(--faint)}
  .chip.on{background:rgba(255,255,255,.07);border-color:currentColor}
  .chip .dot{width:8px;height:8px;border-radius:50%;flex:none}
  .chip .n{color:var(--faint);font-variant-numeric:tabular-nums;font-size:11.5px}
  .chip.on .n{color:inherit;opacity:.65}

  .controls{display:flex;gap:9px 14px;flex-wrap:wrap;align-items:center}
  .fld{display:flex;align-items:center;gap:7px;font-size:12.5px;color:var(--dim)}
  input,select,button{font:inherit}
  input[type=search],input[type=number],select{
    background:var(--bg);border:1px solid var(--line);color:var(--text);
    border-radius:7px;padding:7px 10px;font-size:13.5px;
  }
  select{cursor:pointer}
  input[type=search]{flex:1 1 200px;min-width:160px;max-width:320px}
  input[type=number]{width:74px}
  input:focus-visible,select:focus-visible,button:focus-visible{
    outline:2px solid var(--accent);outline-offset:1px;border-color:transparent;
  }
  .seg{display:flex;border:1px solid var(--line);border-radius:7px;overflow:hidden}
  .seg button{
    background:transparent;border:0;color:var(--dim);padding:7px 12px;
    font-size:12.5px;cursor:pointer;transition:.12s;
  }
  .seg button+button{border-left:1px solid var(--line)}
  .seg button:hover{color:var(--text)}
  .seg button.on{background:rgba(102,192,244,.16);color:#cfe9fa}
  .grow{flex:1 1 auto}
  .endgroup{display:flex;align-items:center;gap:12px;flex-wrap:nowrap}
  .tally{color:var(--dim);font-size:12.5px;font-variant-numeric:tabular-nums;white-space:nowrap}
  .lnk{background:none;border:0;color:var(--accent);cursor:pointer;font-size:12.5px;
       padding:4px 2px;text-decoration:underline;text-underline-offset:2px}

  /* ---------- grid ---------- */
  .grid{
    display:grid;gap:16px;padding:20px 0 40px;
    grid-template-columns:repeat(auto-fill,minmax(268px,1fr));
  }
  .card{
    background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);
    overflow:hidden;display:flex;flex-direction:column;text-decoration:none;
    color:inherit;transition:.14s;
  }
  .card:hover{border-color:var(--faint);transform:translateY(-2px)}
  .card:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  .shot{position:relative;aspect-ratio:460/215;background:var(--panel2)}
  .shot img{width:100%;height:100%;object-fit:cover;display:block}
  .badge{
    position:absolute;left:9px;bottom:9px;background:rgba(8,11,15,.88);
    border-radius:6px;padding:4px 9px;font-size:11.5px;font-weight:600;
    display:flex;align-items:center;gap:7px;backdrop-filter:blur(3px);
  }
  .badge .pc{color:var(--text);font-variant-numeric:tabular-nums;opacity:.75;font-weight:500}
  .tagpill{
    position:absolute;right:9px;top:9px;background:rgba(8,11,15,.85);
    border-radius:6px;padding:3px 8px;font-size:11px;color:var(--dim);
    font-variant-numeric:tabular-nums;backdrop-filter:blur(3px);
  }
  .body{padding:12px 13px 13px;display:flex;flex-direction:column;gap:6px;flex:1}
  .name{font-weight:600;font-size:14.5px;line-height:1.35}
  .sub{color:var(--faint);font-size:12px;line-height:1.4}
  .tags{color:var(--dim);font-size:11.5px;line-height:1.4}
  .foot{
    display:flex;align-items:center;gap:8px;margin-top:auto;padding-top:8px;
    border-top:1px solid var(--line);font-size:12.5px;
  }
  .rev{color:var(--dim);font-variant-numeric:tabular-nums}
  .price{margin-left:auto;font-variant-numeric:tabular-nums;font-weight:600}
  .price.free{color:var(--t9)}
  .off{background:#4c6b22;color:#beee4b;border-radius:4px;padding:1px 5px;
       font-size:11px;font-weight:700;margin-left:6px}

  /* ---------- table ---------- */
  .tblwrap{overflow-x:auto;padding:12px 0 40px}
  table{width:100%;border-collapse:collapse;min-width:720px}
  th{
    text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.7px;
    color:var(--dim);font-weight:600;padding:10px 12px;
    border-bottom:1px solid var(--line);cursor:pointer;user-select:none;white-space:nowrap;
  }
  th:hover{color:var(--text)}
  th .ar{opacity:0;margin-left:4px;font-size:9px}
  th.sorted .ar{opacity:.75}
  td{padding:9px 12px;border-bottom:1px solid rgba(40,49,61,.6);vertical-align:middle}
  tr:hover td{background:rgba(255,255,255,.025)}
  td.thumb{width:104px;padding-right:0}
  td.thumb img{width:92px;height:43px;object-fit:cover;border-radius:3px;display:block;background:var(--panel2)}
  a.tt{color:var(--text);text-decoration:none;font-weight:500}
  a.tt:hover{color:var(--accent)}
  .tier{font-weight:600;white-space:nowrap}
  .num{font-variant-numeric:tabular-nums;white-space:nowrap}

  .empty{padding:70px 20px;text-align:center;color:var(--dim)}
  .empty b{color:var(--text);display:block;margin-bottom:6px;font-size:16px}
  .loading{padding:70px 20px;text-align:center;color:var(--faint)}

  footer{border-top:1px solid var(--line);padding:22px 0 50px;color:var(--faint);font-size:12.5px}
  footer p{margin:0 0 9px;max-width:70ch}
  footer code{background:var(--panel2);padding:1px 5px;border-radius:4px;font-size:12px}
  .toast{
    position:fixed;left:50%;bottom:26px;transform:translateX(-50%) translateY(8px);
    background:var(--panel2);border:1px solid var(--line);color:var(--text);
    padding:9px 16px;border-radius:999px;font-size:13px;opacity:0;
    transition:.2s;pointer-events:none;z-index:60;
  }
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

  @media (max-width:760px){
    .wrap{padding:0 14px}
    .grid{grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
    .name{font-size:13px}
    .sub,.tags{display:none}
    h1{font-size:18px}
    .stamp{margin-left:0;width:100%}
    .tagline{display:none}
    /* A sticky bar this tall would eat the whole screen on a phone. */
    .bar{position:static;backdrop-filter:none}
    /* One scrollable row instead of four wrapped ones. */
    .chips,.presets{
      flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;
      padding-bottom:2px;margin:0 -14px;padding-left:14px;padding-right:14px;
    }
    .chips::-webkit-scrollbar,.presets::-webkit-scrollbar{display:none}
    .badge{font-size:10.5px;padding:3px 7px;gap:5px;left:6px;bottom:6px}
    .tagpill{font-size:10px;padding:2px 6px;right:6px;top:6px}
    input[type=search]{max-width:none}
    .foot{font-size:11.5px;gap:6px}
    .foot .rev{white-space:nowrap}
    /* The price shown is already the discounted one; the badge is what wraps. */
    .grid .off{display:none}
    .body{padding:10px 11px 11px}
  }
  @media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>

<header>
  <div class="wrap">
    <div class="head">
      <h1><span class="mark">&#9679;</span> Rated</h1>
      <span class="tagline">New on Steam, sorted by what people actually think of it</span>
      <span class="stamp" id="stamp"></span>
    </div>
    <div class="presets" id="presets"></div>
  </div>
</header>

<div class="bar">
  <div class="wrap">
    <div class="barin">
      <div class="chips" id="tierChips"></div>
      <div class="controls">
        <div class="seg" id="windowSeg"></div>
        <input type="search" id="q" placeholder="Search title, tag, developer&hellip;" aria-label="Search">
        <select id="tagSel" aria-label="Filter by tag"><option value="">All tags</option></select>
        <label class="fld">min reviews <input type="number" id="minRev" min="0" step="25" value="0" aria-label="Minimum reviews"></label>
        <label class="fld">max $ <input type="number" id="maxPrice" min="0" step="5" placeholder="any" aria-label="Maximum price"></label>
        <select id="sortSel" aria-label="Sort by">
          <option value="rank">Sort: rating tier</option>
          <option value="pct">Sort: % positive</option>
          <option value="reviews">Sort: review count</option>
          <option value="released">Sort: newest</option>
          <option value="price_cents">Sort: cheapest</option>
          <option value="title">Sort: name</option>
        </select>
        <div class="grow"></div>
        <div class="endgroup">
          <div class="seg">
            <button id="viewGrid" class="on" aria-pressed="true">Grid</button>
            <button id="viewTable" aria-pressed="false">Table</button>
          </div>
          <span class="tally" id="tally"></span>
          <button class="lnk" id="share">copy link</button>
          <button class="lnk" id="reset">reset</button>
        </div>
      </div>
    </div>
  </div>
</div>

<main class="wrap">
  <div class="loading" id="loading">Loading&hellip;</div>
  <div class="grid" id="grid" hidden></div>
  <div class="tblwrap" id="tblwrap" hidden>
    <table>
      <thead><tr>
        <th class="thumb"></th>
        <th data-k="title">Game<span class="ar">&#9650;</span></th>
        <th data-k="rank">Rating<span class="ar">&#9650;</span></th>
        <th data-k="pct">%<span class="ar">&#9650;</span></th>
        <th data-k="reviews">Reviews<span class="ar">&#9650;</span></th>
        <th data-k="price_cents">Price<span class="ar">&#9650;</span></th>
        <th data-k="released">Released<span class="ar">&#9650;</span></th>
      </tr></thead>
      <tbody id="rows"></tbody>
    </table>
  </div>
  <div class="empty" id="empty" hidden><b>Nothing matches.</b>Loosen a filter, or widen the time window.</div>
</main>

<footer class="wrap">
  <p id="note"></p>
  <p id="err" style="color:var(--t3)" hidden></p>
  <p>Data from Steam's public store search. Not affiliated with Valve.</p>
</footer>

<div class="toast" id="toast">Link copied</div>

<script>
"use strict";

var TIER_VAR = {
  "Overwhelmingly Positive":"--t9","Very Positive":"--t8","Positive":"--t7",
  "Mostly Positive":"--t6","Mixed":"--t5","Mostly Negative":"--t4",
  "Negative":"--t3","Very Negative":"--t2","Overwhelmingly Negative":"--t1"
};
var WINDOWS = [
  {d:7,label:"7d"},{d:14,label:"14d"},{d:30,label:"30d"},
  {d:90,label:"90d"},{d:0,label:"All"}
];
var PRESETS = [
  {id:"best",   label:"Best new releases",
   note:"Very Positive or better, last 30 days",
   apply:function(s){s.win=30;s.tiers=["Overwhelmingly Positive","Very Positive"];
                     s.sort="rank";s.minRev=0;s.maxPrice="";s.tag="";}},
  {id:"gems",   label:"Hidden gems",
   note:"90%+ positive but under 500 reviews — good games not many people have found yet",
   apply:function(s){s.win=90;s.tiers=null;s.sort="pct";s.minRev=0;s.gem=true;
                     s.maxPrice="";s.tag="";}},
  {id:"cheap",  label:"Good and under $15",
   note:"Positive or better, $15 or less",
   apply:function(s){s.win=90;s.tiers=["Overwhelmingly Positive","Very Positive","Positive"];
                     s.sort="rank";s.maxPrice=15;s.minRev=0;s.tag="";}},
  {id:"free",   label:"Free",
   note:"Free games, best rated first",
   apply:function(s){s.win=0;s.tiers=null;s.sort="rank";s.maxPrice=0;s.minRev=0;s.tag="";}},
  {id:"proven", label:"Proven hits",
   note:"1000+ reviews — the new releases that actually broke through",
   apply:function(s){s.win=90;s.tiers=null;s.sort="reviews";s.minRev=1000;
                     s.maxPrice="";s.tag="";}},
  {id:"stinkers",label:"Avoid these",
   note:"Mixed or worse, sorted worst first",
   apply:function(s){s.win=90;s.tiers=["Mixed","Mostly Negative","Negative",
                     "Very Negative","Overwhelmingly Negative"];
                     s.sort="rankAsc";s.minRev=50;s.maxPrice="";s.tag="";}}
];

var DATA = null, GAMES = [], TIERS = [], PRESENT = [];
var state = {win:90,tiers:null,q:"",tag:"",minRev:0,maxPrice:"",sort:"rank",
             view:"grid",gem:false,preset:""};

var $ = function(id){return document.getElementById(id);};
function esc(s){
  return String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;")
    .replace(/>/g,"&gt;").replace(/"/g,"&quot;");
}
function money(c){
  if(c===null||c===undefined) return "—";
  if(c===0) return "Free";
  return "$"+(c/100).toFixed(2);
}
// "9,000 reviews" wraps on a phone-width card; "9k" does not.
function compact(n){
  n = n || 0;
  if(n < 1000) return String(n);
  var k = n/1000;
  return (k >= 10 ? Math.round(k) : Math.round(k*10)/10) + "k";
}
// Steam's store art lives at hashed paths that can't be derived from the appid,
// so the crawler captures the real capsule URL per game. header.jpg sits in the
// same folder and matches the card's aspect ratio, so try that first and fall
// back to the capsule we know is valid. Older rows with no captured URL still
// resolve on the legacy flat path.
function imgUrls(g){
  var out = [];
  if(g.img){
    var header = g.img.replace(/capsule_\d+x\d+\.jpg$/, "header.jpg");
    if(header !== g.img) out.push(header);
    out.push(g.img);
  }
  out.push("https://cdn.cloudflare.steamstatic.com/steam/apps/"+g.appid+"/header.jpg");
  return out;
}
// Walks the remaining candidates on each load failure, then gives up and leaves
// the panel colour showing rather than a broken-image icon.
function stepImg(el){
  var list = (el.getAttribute("data-alt")||"").split(" ").filter(Boolean);
  if(!list.length){ el.style.display = "none"; return; }
  el.setAttribute("data-alt", list.slice(1).join(" "));
  el.src = list[0];
}
function daysAgo(iso){
  if(!iso) return null;
  var ms = Date.now() - new Date(iso+"T00:00:00Z").getTime();
  return Math.floor(ms/86400000);
}
function ago(iso){
  var d = daysAgo(iso);
  if(d===null) return "";
  if(d<=0) return "today";
  if(d===1) return "yesterday";
  if(d<30) return d+" days ago";
  if(d<60) return "a month ago";
  return Math.round(d/30)+" months ago";
}

// ---------------------------------------------------------------- URL state
function readURL(){
  var p = new URLSearchParams(location.hash.replace(/^#/,""));
  if(p.has("w")) state.win = parseInt(p.get("w"),10)||0;
  if(p.has("t")) state.tiers = p.get("t") ? p.get("t").split("~") : null;
  if(p.has("q")) state.q = p.get("q");
  if(p.has("tag")) state.tag = p.get("tag");
  if(p.has("mr")) state.minRev = parseInt(p.get("mr"),10)||0;
  if(p.has("mp")) state.maxPrice = p.get("mp")===""?"":parseFloat(p.get("mp"));
  if(p.has("s")) state.sort = p.get("s");
  if(p.has("v")) state.view = p.get("v")==="table"?"table":"grid";
  if(p.has("g")) state.gem = p.get("g")==="1";
  if(p.has("p")) state.preset = p.get("p");
}
function writeURL(){
  var p = new URLSearchParams();
  p.set("w",state.win);
  if(state.tiers) p.set("t",state.tiers.join("~"));
  if(state.q) p.set("q",state.q);
  if(state.tag) p.set("tag",state.tag);
  if(state.minRev) p.set("mr",state.minRev);
  if(state.maxPrice!=="") p.set("mp",state.maxPrice);
  if(state.sort!=="rank") p.set("s",state.sort);
  if(state.view!=="grid") p.set("v",state.view);
  if(state.gem) p.set("g","1");
  if(state.preset) p.set("p",state.preset);
  history.replaceState(null,"","#"+p.toString());
}

// ---------------------------------------------------------------- filtering
function inWindow(g){
  if(!state.win) return true;
  var d = daysAgo(g.released);
  return d!==null && d<=state.win;
}
function activeTiers(){
  return state.tiers ? state.tiers : PRESENT;
}
function haystack(g){
  if(g._h) return g._h;
  g._h = [g.title,(g.tags||[]).join(" "),g.dev||"",(g.genres||[]).join(" ")]
         .join(" ").toLowerCase();
  return g._h;
}
function filtered(){
  var tiers = {}, i;
  var at = activeTiers();
  for(i=0;i<at.length;i++) tiers[at[i]] = 1;
  var q = state.q.trim().toLowerCase();
  var maxP = state.maxPrice==="" ? null : state.maxPrice*100;

  return GAMES.filter(function(g){
    if(!inWindow(g)) return false;
    if(!tiers[g.tier]) return false;
    if((g.reviews||0) < state.minRev) return false;
    if(state.gem && !(g.pct>=90 && g.reviews<500)) return false;
    if(maxP!==null){
      if(g.price_cents===null||g.price_cents===undefined) return false;
      if(g.price_cents>maxP) return false;
    }
    if(state.tag && (g.tags||[]).indexOf(state.tag)<0 &&
       (g.genres||[]).indexOf(state.tag)<0) return false;
    if(q && haystack(g).indexOf(q)<0) return false;
    return true;
  });
}
function sortList(list){
  var k = state.sort, asc = false;
  if(k==="rankAsc"){k="rank";asc=true;}
  if(k==="title"||k==="price_cents") asc = true;
  list.sort(function(a,b){
    if(k==="title") return a.title.localeCompare(b.title);
    var x,y;
    if(k==="released"){
      x=a.released||"";y=b.released||"";
      return x<y?1:x>y?-1:(b.reviews||0)-(a.reviews||0);
    }
    x = a[k]; y = b[k];
    x = (x===null||x===undefined) ? (asc?Infinity:-1) : x;
    y = (y===null||y===undefined) ? (asc?Infinity:-1) : y;
    if(x===y) return (b.reviews||0)-(a.reviews||0);
    return asc ? x-y : y-x;
  });
  return list;
}

// ---------------------------------------------------------------- rendering
function render(){
  var list = sortList(filtered());
  $("tally").textContent = list.length.toLocaleString()+" of "+
                           GAMES.length.toLocaleString();

  // tier chip counts respond to every other filter
  var save = state.tiers; state.tiers = PRESENT;
  var pool = filtered(); state.tiers = save;
  var counts = {};
  pool.forEach(function(g){counts[g.tier]=(counts[g.tier]||0)+1;});
  var at = {}; activeTiers().forEach(function(t){at[t]=1;});
  Array.prototype.forEach.call(document.querySelectorAll("#tierChips .chip"),
    function(c){
      var t = c.dataset.tier;
      c.classList.toggle("on", !!at[t] && !!state.tiers);
      c.querySelector(".n").textContent = counts[t]||0;
    });

  Array.prototype.forEach.call(document.querySelectorAll("#windowSeg button"),
    function(b){
      var on = parseInt(b.dataset.d,10)===state.win;
      b.classList.toggle("on",on); b.setAttribute("aria-pressed",on);
    });
  Array.prototype.forEach.call(document.querySelectorAll("#presets .preset"),
    function(b){b.classList.toggle("on", b.dataset.id===state.preset);});

  $("viewGrid").classList.toggle("on",state.view==="grid");
  $("viewTable").classList.toggle("on",state.view==="table");
  $("viewGrid").setAttribute("aria-pressed",state.view==="grid");
  $("viewTable").setAttribute("aria-pressed",state.view==="table");

  $("empty").hidden = list.length>0;
  $("grid").hidden = !(state.view==="grid" && list.length);
  $("tblwrap").hidden = !(state.view==="table" && list.length);

  if(list.length){
    if(state.view==="grid") renderGrid(list); else renderTable(list);
  }
  writeURL();
}

function imgTag(g){
  var srcs = imgUrls(g);
  return '<img loading="lazy" decoding="async" alt="" src="'+esc(srcs[0])+'" '+
         'data-alt="'+esc(srcs.slice(1).join(" "))+'" onerror="stepImg(this)">';
}
// Steam does show 100%-off promos, but "Free -50%" reads as a bug.
function discountTag(g){
  return (g.discount && g.price_cents) ? '<span class="off">-'+g.discount+'%</span>' : '';
}

function renderGrid(list){
  var out = [], i, g;
  for(i=0;i<list.length;i++){
    g = list[i];
    var sub = [g.dev,(g.genres||[]).slice(0,2).join(", ")].filter(Boolean).join(" · ");
    out.push(
      '<a class="card" href="https://store.steampowered.com'+esc(g.url)+
        '" target="_blank" rel="noopener">'+
        '<div class="shot">'+imgTag(g)+
          '<div class="badge" style="color:var('+(TIER_VAR[g.tier]||"--dim")+')">'+
            esc(g.tier)+'<span class="pc">'+g.pct+'%</span></div>'+
          '<div class="tagpill">'+esc(ago(g.released))+'</div>'+
        '</div>'+
        '<div class="body">'+
          '<div class="name">'+esc(g.title)+'</div>'+
          (sub?'<div class="sub">'+esc(sub)+'</div>':'')+
          ((g.tags&&g.tags.length)?'<div class="tags">'+esc(g.tags.slice(0,3).join(" · "))+'</div>':'')+
          '<div class="foot">'+
            '<span class="rev">'+compact(g.reviews)+' reviews</span>'+
            '<span class="price'+(g.price_cents===0?' free':'')+'">'+money(g.price_cents)+
              discountTag(g)+'</span>'+
          '</div>'+
        '</div>'+
      '</a>');
  }
  $("grid").innerHTML = out.join("");
}

function renderTable(list){
  var out = [], i, g;
  for(i=0;i<list.length;i++){
    g = list[i];
    var sub = [g.dev,(g.tags||[]).slice(0,3).join(", ")].filter(Boolean).join(" · ");
    out.push('<tr>'+
      '<td class="thumb"><a href="https://store.steampowered.com'+esc(g.url)+
        '" target="_blank" rel="noopener">'+imgTag(g)+'</a></td>'+
      '<td><a class="tt" href="https://store.steampowered.com'+esc(g.url)+
        '" target="_blank" rel="noopener">'+esc(g.title)+'</a>'+
        (sub?'<div class="sub">'+esc(sub)+'</div>':'')+'</td>'+
      '<td class="tier" style="color:var('+(TIER_VAR[g.tier]||"--dim")+')">'+esc(g.tier)+'</td>'+
      '<td class="num">'+g.pct+'%</td>'+
      '<td class="num">'+(g.reviews||0).toLocaleString()+'</td>'+
      '<td class="num">'+money(g.price_cents)+discountTag(g)+'</td>'+
      '<td class="num" style="color:var(--dim)">'+esc(g.released||"")+'</td>'+
    '</tr>');
  }
  $("rows").innerHTML = out.join("");
  var k = state.sort==="rankAsc"?"rank":state.sort;
  Array.prototype.forEach.call(document.querySelectorAll("th[data-k]"),function(th){
    var on = th.dataset.k===k;
    th.classList.toggle("sorted",on);
    if(on) th.querySelector(".ar").innerHTML =
      (state.sort==="rankAsc"||k==="title"||k==="price_cents")?"&#9650;":"&#9660;";
  });
}

// ---------------------------------------------------------------- wiring
function buildChrome(){
  var box = $("tierChips");
  PRESENT.forEach(function(t){
    var b = document.createElement("button");
    b.className = "chip"; b.dataset.tier = t;
    b.style.color = "var("+TIER_VAR[t]+")";
    b.innerHTML = '<span class="dot" style="background:var('+TIER_VAR[t]+')"></span>'+
                  '<span>'+t+'</span><span class="n"></span>';
    b.onclick = function(){
      var cur = state.tiers ? state.tiers.slice() : PRESENT.slice();
      if(!state.tiers){ cur = [t]; }                 // first click isolates
      else if(cur.indexOf(t)>=0){
        cur = cur.filter(function(x){return x!==t;});
        if(!cur.length) cur = null;                  // none left -> all
      } else { cur.push(t); }
      state.tiers = cur; state.preset = ""; render();
    };
    box.appendChild(b);
  });

  var seg = $("windowSeg");
  WINDOWS.forEach(function(w){
    var b = document.createElement("button");
    b.textContent = w.label; b.dataset.d = w.d;
    b.onclick = function(){ state.win = w.d; state.preset=""; render(); };
    seg.appendChild(b);
  });

  var pbox = $("presets");
  PRESETS.forEach(function(p){
    var b = document.createElement("button");
    b.className = "preset"; b.dataset.id = p.id; b.textContent = p.label;
    b.title = p.note;
    b.onclick = function(){
      if(state.preset===p.id){ resetAll(); return; }
      state.gem = false; state.q = "";
      p.apply(state); state.preset = p.id;
      syncInputs(); render();
    };
    pbox.appendChild(b);
  });

  // tag facet, most common first
  var freq = {};
  GAMES.forEach(function(g){
    (g.tags||[]).forEach(function(t){freq[t]=(freq[t]||0)+1;});
  });
  Object.keys(freq).sort(function(a,b){return freq[b]-freq[a];}).slice(0,40)
    .sort().forEach(function(t){
      var o = document.createElement("option");
      o.value = t; o.textContent = t+" ("+freq[t]+")";
      $("tagSel").appendChild(o);
    });
}

function syncInputs(){
  $("q").value = state.q;
  $("tagSel").value = state.tag;
  $("minRev").value = state.minRev;
  $("maxPrice").value = state.maxPrice===""?"":state.maxPrice;
  $("sortSel").value = state.sort==="rankAsc"?"rank":state.sort;
}

function resetAll(){
  state.win=90; state.tiers=null; state.q=""; state.tag=""; state.minRev=0;
  state.maxPrice=""; state.sort="rank"; state.gem=false; state.preset="";
  syncInputs(); render();
}

function debounce(fn,ms){
  var t; return function(){clearTimeout(t);t=setTimeout(fn,ms);};
}

function wireInputs(){
  $("q").addEventListener("input",debounce(function(){
    state.q = $("q").value; state.preset=""; render();
  },140));
  $("tagSel").onchange = function(){state.tag=$("tagSel").value;state.preset="";render();};
  $("minRev").addEventListener("input",debounce(function(){
    state.minRev = parseInt($("minRev").value,10)||0; state.preset=""; render();
  },140));
  $("maxPrice").addEventListener("input",debounce(function(){
    var v = $("maxPrice").value;
    state.maxPrice = v===""?"":(parseFloat(v)||0); state.preset=""; render();
  },140));
  $("sortSel").onchange = function(){state.sort=$("sortSel").value;render();};
  $("viewGrid").onclick = function(){state.view="grid";render();};
  $("viewTable").onclick = function(){state.view="table";render();};
  $("reset").onclick = resetAll;
  $("share").onclick = function(){
    var url = location.href;
    var done = function(){
      var t=$("toast"); t.classList.add("show");
      setTimeout(function(){t.classList.remove("show");},1600);
    };
    if(navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(url).then(done,done);
    } else { done(); }
  };
  Array.prototype.forEach.call(document.querySelectorAll("th[data-k]"),function(th){
    th.onclick = function(){
      var k = th.dataset.k;
      if(k==="rank") state.sort = (state.sort==="rank")?"rankAsc":"rank";
      else state.sort = k;
      syncInputs(); render();
    };
  });
}

// ---------------------------------------------------------------- boot
fetch("data.json",{cache:"no-cache"})
  .then(function(r){
    if(!r.ok) throw new Error("data.json returned "+r.status);
    return r.json();
  })
  .then(function(d){
    DATA = d; GAMES = d.games || []; TIERS = d.meta.tiers;
    PRESENT = TIERS.filter(function(t){
      return GAMES.some(function(g){return g.tier===t;});
    });

    var when = new Date(d.meta.generated);
    $("stamp").textContent = GAMES.length.toLocaleString()+" games · updated "+
      (isNaN(when) ? d.meta.generated : when.toLocaleString(undefined,
        {month:"short",day:"numeric",hour:"numeric",minute:"2-digit"}));
    $("note").innerHTML =
      "Steam's rating tiers depend on review <em>count</em>, not just percentage: "+
      "<b>Positive</b> is 10–49 reviews at 80%+, <b>Very Positive</b> needs 50+, and "+
      "<b>Overwhelmingly Positive</b> needs 500+ at 95%+. A game released last week "+
      "usually cannot be in the top tier yet — it has not had time to collect the "+
      "reviews. That is why <b>Hidden gems</b> sorts by percentage instead of tier. "+
      "Showing releases from the last "+d.meta.days+" days with "+
      d.meta.min_reviews+"+ reviews, "+d.meta.region+" prices.";

    readURL();
    buildChrome();
    wireInputs();
    syncInputs();
    $("loading").hidden = true;
    render();
  })
  .catch(function(e){
    $("loading").hidden = true;
    $("err").hidden = false;
    $("err").textContent = "Could not load data.json — "+e.message+
      ". If you just deployed, the refresh workflow may not have run yet.";
  });

window.addEventListener("hashchange",function(){
  readURL(); syncInputs(); render();
});
</script>
</body>
</html>
